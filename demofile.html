<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · More Options</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(145deg, #1a0b12 0%, #3f101d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 2rem;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.02);
      transition: transform 0.3s ease;
    }
    .login-card:hover { transform: translateY(-2px); }

    /* Language switch row */
    .top-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 1rem;
    }
    .lang-select {
      background: rgba(45, 16, 22, 0.7);
      border: 1px solid rgba(248, 113, 113, 0.25);
      color: #f8d7d7;
      font-size: 0.8rem;
      font-family: inherit;
      padding: 0.35rem 0.7rem;
      border-radius: 0.6rem;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }
    .lang-select:hover, .lang-select:focus { border-color: #ef4444; }

    /* Header */
    .login-header { text-align: center; margin-bottom: 2rem; }
    .login-header h2 {
      font-size: 2rem; font-weight: 700; color: #fff;
      letter-spacing: -0.02em; margin-bottom: 0.5rem;
    }
    .login-header p { font-size: 0.95rem; color: #f4b9bc; }

    /* Inputs */
    .input-group { margin-bottom: 1.3rem; position: relative; }
    .input-group label {
      display: block; font-size: 0.85rem; font-weight: 500;
      color: #f8d7d7; margin-bottom: 0.5rem; letter-spacing: 0.3px;
    }
    .input-icon-wrapper { position: relative; display: flex; align-items: center; }
    .input-icon-wrapper i.field-icon {
      position: absolute; left: 1rem; color: #fca5a5;
      font-size: 1.05rem; transition: color 0.2s; pointer-events: none;
    }
    .input-group input {
      width: 100%;
      padding: 0.9rem 3rem 0.9rem 3rem;
      background: rgba(40, 14, 18, 0.75);
      border: 1.5px solid rgba(248, 113, 113, 0.25);
      border-radius: 1rem;
      color: #fff5f5; font-size: 0.95rem; outline: none;
      transition: all 0.2s ease;
    }
    .input-group input::placeholder { color: #fca5a5; }
    .input-group input:focus {
      border-color: #ef4444;
      background: rgba(35, 10, 15, 0.9);
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.15);
    }
    .input-group input:focus ~ i.field-icon { color: #ef4444; }

    /* Password visibility toggle */
    .toggle-pass {
      position: absolute; right: 0.9rem;
      background: transparent; border: none; cursor: pointer;
      color: #fca5a5; font-size: 1rem; padding: 0.4rem;
      transition: color 0.2s;
    }
    .toggle-pass:hover { color: #ef4444; }

    /* Options row */
    .form-options {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.2rem; font-size: 0.9rem; flex-wrap: wrap; gap: 0.5rem;
    }
    .remember-me {
      display: flex; align-items: center; gap: 0.5rem;
      color: #f8d7d7; cursor: pointer; user-select: none;
    }
    .remember-me input[type="checkbox"] {
      width: 1rem; height: 1rem; accent-color: #ef4444;
      cursor: pointer; border-radius: 0.25rem;
    }
    .forgot-link {
      color: #f4b9bc; text-decoration: none;
      font-weight: 500; transition: color 0.2s;
    }
    .forgot-link:hover { color: #ef4444; text-decoration: underline; }

    /* Remember device pill */
    .device-row {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(40, 14, 18, 0.6);
      border: 1px solid rgba(248, 113, 113, 0.18);
      border-radius: 0.9rem;
      padding: 0.7rem 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      color: #f8d7d7;
    }
    .device-row .device-info { display: flex; align-items: center; gap: 0.6rem; }
    .device-row i { color: #ef4444; }
    /* Toggle switch */
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background: #4c1d1d; border-radius: 34px; transition: 0.3s;
    }
    .slider:before {
      content: ""; position: absolute; height: 16px; width: 16px;
      left: 3px; bottom: 3px; background: #fff;
      border-radius: 50%; transition: 0.3s;
    }
    .switch input:checked + .slider { background: #ef4444; }
    .switch input:checked + .slider:before { transform: translateX(18px); }

    /* Login button */
    .login-btn {
      width: 100%; padding: 0.9rem 1.5rem;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      border: none; border-radius: 1rem; color: #fff;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      gap: 0.75rem; transition: all 0.25s ease;
      box-shadow: 0 12px 24px -8px rgba(239, 68, 68, 0.45);
      letter-spacing: 0.3px; margin-bottom: 1.2rem;
    }
    .login-btn:hover {
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      box-shadow: 0 16px 30px -8px rgba(220, 38, 38, 0.6);
      transform: translateY(-1px);
    }
    .login-btn i { transition: transform 0.2s; }
    .login-btn:hover i { transform: translateX(3px); }
    .login-btn:active { transform: translateY(1px); }

    /* Extra auth options grid */
    .alt-methods {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.7rem;
      margin-bottom: 1.3rem;
    }
    .alt-btn {
      display: flex; align-items: center; justify-content: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.9rem;
      padding: 0.7rem 0.5rem;
      color: #f8d7d7; font-size: 0.85rem; font-weight: 500;
      cursor: pointer; text-decoration: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .alt-btn i { font-size: 1rem; }
    .alt-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(239, 68, 68, 0.5);
      color: #fff;
      transform: translateY(-2px);
    }

    /* Divider */
    .divider {
      display: flex; align-items: center; gap: 1rem;
      margin: 1.3rem 0 1.1rem; color: #fca5a5;
      font-size: 0.78rem; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .divider::before, .divider::after {
      content: ""; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(252, 165, 165, 0.35), transparent);
    }

    /* Social row */
    .social-login {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.7rem;
      margin-bottom: 1.2rem;
    }
    .social-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 0.9rem;
      padding: 0.7rem 0;
      display: flex; align-items: center; justify-content: center;
      color: #f8d7d7; font-size: 1.15rem;
      cursor: pointer; transition: all 0.2s ease;
      text-decoration: none;
    }
    .social-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(239, 68, 68, 0.35);
      color: #fff; transform: translateY(-2px);
    }

    /* Help / support links */
    .help-links {
      display: flex; justify-content: center; gap: 1.2rem;
      font-size: 0.8rem; color: #fca5a5;
      margin-bottom: 1rem; flex-wrap: wrap;
    }
    .help-links a {
      color: #f4b9bc; text-decoration: none;
      transition: color 0.2s;
    }
    .help-links a:hover { color: #ef4444; }

    /* Sign up prompt */
    .signup-prompt {
      text-align: center; font-size: 0.9rem;
      color: #f4b9bc; margin-top: 1rem;
    }
    .signup-prompt a {
      color: #ef4444; font-weight: 600;
      text-decoration: none; transition: color 0.2s;
    }
    .signup-prompt a:hover { color: #f87171; text-decoration: underline; }

    @media (max-width: 480px) {
      .login-card { padding: 2rem 1.4rem; border-radius: 1.5rem; }
      .login-header h2 { font-size: 1.75rem; }
      .form-options { flex-direction: column; align-items: flex-start; }
      .social-login { grid-template-columns: repeat(4, 1fr); }
      .alt-methods { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="login-card">

    <!-- Language selector -->
    <div class="top-row">
      <select class="lang-select" aria-label="Select language">
        <option>🌐 English</option>
        <option>🇪🇸 Español</option>
        <option>🇫🇷 Français</option>
        <option>🇩🇪 Deutsch</option>
        <option>🇮🇳 हिन्दी</option>
      </select>
    </div>

    <!-- Header -->
    <div class="login-header">
      <h2>Welcome back</h2>
      <p>Sign in with your preferred method</p>
    </div>

    <form action="#" method="POST">

      <!-- Email -->
      <div class="input-group">
        <label for="email">Email address</label>
        <div class="input-icon-wrapper">
          <i class="fas fa-envelope field-icon"></i>
          <input type="email" id="email" placeholder="name@example.com" required autocomplete="email">
        </div>
      </div>

      <!-- Password with show/hide toggle -->
      <div class="input-group">
        <label for="password">Password</label>
        <div class="input-icon-wrapper">
          <i class="fas fa-lock field-icon"></i>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <!-- Remember me + Forgot -->
      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" checked>
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <!-- Remember this device (toggle switch) -->
      <div class="device-row">
        <span class="device-info">
          <i class="fas fa-shield-halved"></i> Remember this device for 30 days
        </span>
        <label class="switch">
          <input type="checkbox" checked>
          <span class="slider"></span>
        </label>
      </div>

      <!-- Primary login -->
      <button type="submit" class="login-btn">
        Log in <i class="fas fa-arrow-right"></i>
      </button>

      <!-- Extra authentication options -->
      <div class="alt-methods">
        <button type="button" class="alt-btn">
          <i class="fas fa-fingerprint"></i> Passkey
        </button>
        <button type="button" class="alt-btn">
          <i class="fas fa-mobile-screen-button"></i> OTP / SMS
        </button>
        <button type="button" class="alt-btn">
          <i class="fas fa-qrcode"></i> QR code
        </button>
        <button type="button" class="alt-btn">
          <i class="fas fa-id-card"></i> SSO / SAML
        </button>
      </div>

      <!-- Divider -->
      <div class="divider">or continue with</div>

      <!-- Social logins -->
      <div class="social-login">
        <a href="#" class="social-btn" aria-label="Google"><i class="fab fa-google"></i></a>
        <a href="#" class="social-btn" aria-label="GitHub"><i class="fab fa-github"></i></a>
        <a href="#" class="social-btn" aria-label="Apple"><i class="fab fa-apple"></i></a>
        <a href="#" class="social-btn" aria-label="Microsoft"><i class="fab fa-microsoft"></i></a>
      </div>

      <!-- Help links -->
      <div class="help-links">
        <a href="#"><i class="fas fa-circle-question"></i> Need help?</a>
        <a href="#"><i class="fas fa-headset"></i> Contact support</a>
        <a href="#"><i class="fas fa-key"></i> Recover account</a>
      </div>

    </form>

    <!-- Sign up -->
    <div class="signup-prompt">
      Don't have an account? <a href="#">Create one</a>
    </div>

  </div>

  <script>
    // Password show/hide toggle
    const togglePass = document.getElementById('togglePass');
    const passInput = document.getElementById('password');
    togglePass.addEventListener('click', () => {
      const isHidden = passInput.type === 'password';
      passInput.type = isHidden ? 'text' : 'password';
      togglePass.innerHTML = isHidden
        ? '<i class="fas fa-eye-slash"></i>'
        : '<i class="fas fa-eye"></i>';
      togglePass.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
    });
  </script>

</body>
</html>
